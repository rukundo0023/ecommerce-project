<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset your password</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f3f5f9;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      main {
        width: min(100%, 420px);
        padding: 32px;
        box-sizing: border-box;
        background: #fff;
        border: 1px solid #e2e6ee;
        border-radius: 12px;
        box-shadow: 0 12px 32px rgb(23 32 51 / 8%);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.6rem;
      }

      p {
        color: #526078;
        line-height: 1.5;
      }

      label {
        display: block;
        margin: 20px 0 6px;
        font-weight: 600;
      }

      input,
      button {
        width: 100%;
        min-height: 44px;
        box-sizing: border-box;
        border-radius: 6px;
        font: inherit;
      }

      input {
        padding: 10px 12px;
        border: 1px solid #aeb8c8;
      }

      input:user-invalid {
        border-color: #dc2626;
      }

      input:user-invalid:focus-visible {
        outline: 3px solid rgb(220 38 38 / 25%);
        outline-offset: 2px;
      }

      button {
        margin-top: 24px;
        border: 0;
        color: #fff;
        background: #2457d6;
        font-weight: 650;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      #message {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 2;
        max-width: min(420px, calc(100vw - 48px));
        margin: 0;
        padding: 16px 20px;
        border: 1px solid #d9e3e8;
        border-left: 4px solid #0f766e;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 16px 40px rgb(15 23 42 / 16%);
        font-size: 1rem;
        font-weight: 600;
        line-height: 1.55;
      }

      #message:empty {
        display: none;
      }

      #message[data-state="error"] {
        color: #9f1239;
        border-color: #ffe4e6;
        border-left-color: #e11d48;
        background: #fff;
      }

      #message[data-state="success"] {
        color: #065f46;
        border-color: #d1fae5;
        border-left-color: #10b981;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Reset your password</h1>
      <p>Choose a new password for your account. It must be between 8 and 128 characters.</p>
      <form id="reset-form">
        <label for="password">New password</label>
        <input
          id="password"
          name="password"
          type="password"
          minlength="8"
          maxlength="128"
          autocomplete="new-password"
          required
        >
        <label for="confirm-password">Confirm new password</label>
        <input
          id="confirm-password"
          name="confirm-password"
          type="password"
          minlength="8"
          maxlength="128"
          autocomplete="new-password"
          required
        >
        <button id="submit-button" type="submit">Update password</button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script>
      const form = document.querySelector("#reset-form");
      const passwordInput = document.querySelector("#password");
      const confirmInput = document.querySelector("#confirm-password");
      const submitButton = document.querySelector("#submit-button");
      const message = document.querySelector("#message");
      const token = new URLSearchParams(window.location.search).get("token");

      const showMessage = (text, state) => {
        message.textContent = text;
        message.dataset.state = state;
      };

      if (!/^[a-f0-9]{64}$/i.test(token ?? "")) {
        form.hidden = true;
        showMessage("This reset link is invalid. Request a new password reset email.", "error");
      }

      const validatePasswordConfirmation = () => {
        confirmInput.setCustomValidity(
          confirmInput.value === passwordInput.value
            ? ""
            : "Passwords do not match."
        );
      };
      passwordInput.addEventListener("input", validatePasswordConfirmation);
      confirmInput.addEventListener("input", validatePasswordConfirmation);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        showMessage("", "");

        if (passwordInput.value !== confirmInput.value) {
          showMessage("The passwords do not match.", "error");
          confirmInput.focus();
          return;
        }

        submitButton.disabled = true;
        try {
          const response = await fetch("/api/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, password: passwordInput.value }),
          });
          const result = await response.json();

          if (!response.ok) {
            showMessage(result.message || "Unable to reset your password. Request a new reset link and try again.", "error");
            return;
          }

          form.hidden = true;
          showMessage("Your password has been reset. You can now sign in with your new password.", "success");
        } catch {
          showMessage("Could not reach the server. Check your connection and try again.", "error");
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
